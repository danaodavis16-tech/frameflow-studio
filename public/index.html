
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FrameFlow Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #101114;
      color: #f5f2ed;
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    main { max-width: 680px; width: 100%; }
    .tag {
      color: #ff715b;
      text-transform: uppercase;
      letter-spacing: .18em;
      font-size: 12px;
      font-weight: 700;
    }
    h1 { font-size: clamp(40px, 8vw, 68px); margin: 16px 0; }
    p { color: #b7b5b1; line-height: 1.7; }
    button {
      background: #ff715b;
      color: #171313;
      border: 0;
      padding: 14px 20px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }
    #status { margin-top: 18px; }
  </style>
</head>
<body>
  <main>
    <div class="tag">Cinematic story development</div>
    <h1>FrameFlow Studio</h1>
    <p>Build scenes, design storyboard frames, and bring your stories to life with AI-assisted filmmaking.</p>
    <button id="check">Check server connection</button>
    <p id="status">Ready to test the connection.</p>
  </main>
  <script>
    document.getElementById("check").addEventListener("click", async () => {
      const status = document.getElementById("status");
      status.textContent = "Checking...";
      try {
        const response = await fetch("/api/health");
        const data = await response.json();
        status.textContent = data.ok
          ? "Connected to the FrameFlow server."
          : "Server responded, but needs checking.";
      } catch {
        status.textContent = "Cannot reach the server yet. Check deployment.";
      }
    });
  </script>
</body>
</html>
